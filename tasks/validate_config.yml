---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "restic_container_tmp_size", "new": "restic_container_tmpfs_tmp_size" }
    - { "old": "restic_docker_image_name_prefix", "new": "restic_container_image_registry_prefix" }
    - { "old": "restic_docker_image", "new": "restic_container_image" }
    - { "old": "restic_docker_image_force_pull", "new": "restic_container_image_force_pull" }
    - { "old": "restic_docker_image_registry_prefix", "new": "restic_container_image_registry_prefix" }
    - { "old": "restic_docker_image_registry_prefix_upstream", "new": "restic_container_image_registry_prefix_upstream" }
    - { "old": "restic_docker_image_registry_prefix_upstream_default", "new": "restic_container_image_registry_prefix_upstream_default" }
    - { "old": "restic_container_repo", "new": "restic_container_image_self_build_repo" }
    - { "old": "restic_container_src_files_path", "new": "restic_container_image_self_build_src_files_path" }
    - { "old": "restic_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required restic settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "restic_ssh_key_private", when: true }
    - { "name": "restic_location_repositories", when: true }
    - { "name": "restic_uid", when: true }
    - { "name": "restic_gid", when: true }
    - { "name": "restic_container_network", when: true }
    - { "name": "restic_postgresql_databases_hostname", when: "{{ restic_postgresql_enabled }}" }
    - { "name": "restic_mariadb_databases_hostname", when: "{{ restic_mariadb_enabled }}" }
    - { "name": "restic_mongodb_databases_hostname", when: "{{ restic_mongodb_enabled }}" }
    - { "name": "restic_mysql_databases_hostname", when: "{{ restic_mysql_enabled }}" }
    - { "name": "restic_ntfy_server", when: "{{ restic_ntfy_topic != '' }}" }
    - { "name": "restic_ntfy_access_password", when: "{{ restic_ntfy_access_username != '' }}" }

- name: Fail if encryption passphrase is undefined unless repository is unencrypted
  ansible.builtin.fail:
    msg: >-
      You need to define a required passphrase using the `restic_storage_encryption_passphrase` variable.
  when: "restic_storage_encryption_passphrase == '' and restic_encryption != 'none'"
