---
- name: Ensure restic path exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ restic_uid }}"
    group: "{{ restic_gid }}"
  with_items:
    - "{{ restic_base_path }}"

- name: Ensure restic support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ restic_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ restic_uid }}"
    group: "{{ restic_gid }}"
  with_items:
    - env
  register: restic_support_files_result

- name: Run if self-building of restic container image is not enabled
  when: "not restic_container_image_self_build | bool"
  block:
    - name: Ensure restic container image is pulled via community.docker.docker_image_pull
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image_pull:
        name: "{{ restic_container_image }}"
        pull: always
      register: restic_container_image_pull_result_ansible_module
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: restic_container_image_pull_result_ansible_module is not failed

    - name: Ensure restic container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ restic_container_image }}"
      register: restic_container_image_pull_result_command
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: restic_container_image_pull_result_command is not failed
      changed_when: "'Downloaded newer image' in restic_container_image_pull_result_command.stdout"

- name: Run if self-building of restic container image is enabled
  when: "restic_container_image_self_build | bool"
  block:
    - name: Ensure restic repository is present on self-build
      ansible.builtin.git:
        repo: "{{ restic_container_image_self_build_repo }}"
        version: "{{ restic_container_image_self_build_repo_version }}"
        dest: "{{ restic_container_image_self_build_src_files_path }}"
        force: "yes"
      register: restic_git_pull_results

    - name: Ensure restic container image is built
      community.docker.docker_image_build:
        name: "{{ restic_container_image }}"
        dockerfile: docker/Dockerfile
        path: "{{ restic_container_image_self_build_src_files_path }}"
        pull: true
        rebuild: "{{ 'always' if restic_git_pull_results.changed | bool else 'never' }}"
      register: restic_container_image_build_result

- name: Ensure restic container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ restic_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: restic_network_creation_result

- name: Ensure restic container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ restic_container_network }}
  register: restic_network_creation_result
  changed_when: restic_network_creation_result.rc == 0
  failed_when: restic_network_creation_result.rc != 0 and 'already exists' not in restic_network_creation_result.stderr

- name: Ensure restic systemd service and timer are installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/restic.{{ item }}.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ restic_identifier }}.{{ item }}"
    mode: "0644"
  with_items:
    - service
    - timer
  register: restic_systemd_services_result

- name: Determine whether restic needs a restart
  ansible.builtin.set_fact:
    restic_restart_necessary: >-
      {{
        restic_support_files_result.changed | default(false)
        or restic_systemd_services_result.changed | default(false)
        or restic_container_image_pull_result_ansible_module.changed | default(false)
        or restic_container_image_pull_result_command.changed | default(false)
        or restic_container_image_build_result.changed | default(false)
      }}
