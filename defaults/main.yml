---
# Project source code URL: https://github.com/restic/restic

restic_enabled: true

restic_identifier: restic
restic_base_path: "/{{ restic_identifier }}"

# renovate: datasource=docker depName=restic/restic versioning=semver
restic_version: 0.19.1

restic_uid: ""
restic_gid: ""

restic_container_image: "{{ restic_container_image_registry_prefix }}restic/restic:{{ restic_container_image_tag }}"
restic_container_image_tag: "{{ restic_version }}"
restic_container_image_registry_prefix: "{{ restic_container_image_registry_prefix_upstream }}"
restic_container_image_registry_prefix_upstream: "{{ restic_container_image_registry_prefix_upstream_default }}"
restic_container_image_registry_prefix_upstream_default: docker.io/

restic_container_image_self_build: false
restic_container_image_self_build_repo: "https://github.com/restic/restic.git"
restic_container_image_self_build_repo_version: "{{ 'v' + restic_version if restic_version != 'latest' else 'master' }}"
restic_container_image_self_build_src_files_path: "{{ restic_base_path }}/docker-src"

# The hostname to assign to the container (its `--hostname`).
# Pinned to a stable value, because Docker otherwise randomizes it on each (re)creation
# See: https://github.com/restic/restic/blob/master/docker/README.md
restic_container_hostname: "{{ restic_identifier }}"

# The base container network. It will be auto-created by this role if it doesn't exist already.
restic_container_network: "{{ restic_identifier }}"

# Control if the container network is deleted on uninstalling.
restic_container_network_deletion_enabled: true

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
restic_container_additional_volumes: "{{ restic_container_additional_volumes_auto + restic_container_additional_volumes_custom }}"
restic_container_additional_volumes_auto: []
restic_container_additional_volumes_custom: []

# Specify the size of the container's tmpfs volumes
restic_container_tmpfs_cache_size: 4096m
restic_container_tmpfs_tmp_size: "{{ restic_container_tmpfs_cache_size }}"

# A list of extra arguments to pass to the container (`docker create` command)
restic_container_extra_arguments: "{{ restic_container_extra_arguments_auto + restic_container_extra_arguments_custom }}"
restic_container_extra_arguments_auto: []
restic_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
restic_process_extra_arguments: "{{ restic_process_extra_arguments_auto + restic_process_extra_arguments_custom }}"
restic_process_extra_arguments_auto:
  - "backup /data"
restic_process_extra_arguments_custom: []

# List of systemd services that the restic systemd service depends on
restic_systemd_required_services_list: "{{ restic_systemd_required_services_list_default + restic_systemd_required_services_list_auto + restic_systemd_required_services_list_custom }}"
restic_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
restic_systemd_required_services_list_auto: []
restic_systemd_required_services_list_custom: []

# List of systemd services that the restic systemd service wants
restic_systemd_wanted_services_list: "{{ restic_systemd_wanted_services_list_default + restic_systemd_wanted_services_list_auto + restic_systemd_wanted_services_list_custom }}"
restic_systemd_wanted_services_list_default: []
restic_systemd_wanted_services_list_auto: []
restic_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
restic_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
restic_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
restic_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
restic_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ restic_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ restic_container_stop_grace_time_seconds }} {{ restic_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ restic_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ restic_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ restic_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ restic_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ restic_identifier }} after {{ restic_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify systemd calendar configuration for the backup job
# Note that the actual job may run with a delay (see `restic_schedule_randomized_delay_sec`)
restic_schedule: "*-*-* 04:00:00"

# Specify the delay with which the systemd timer may run in relation to the `restic_schedule` schedule
restic_schedule_randomized_delay_sec: 2h

# Specify the timezone
restic_environment_variables_tz: UTC

# Specify the repository location
restic_environment_variables_restic_repository: ""

# Specify the actual password for the repository
restic_environment_variables_restic_password: ""

# Specify the pack size in MiB
restic_environment_variables_restic_pack_size: ""

# Specify Rest Server username
restic_environment_variables_rest_username: ""

# Specify Rest Server password
restic_environment_variables_rest_password: ""

# Additional environment variables.
restic_environment_variables_additional_variables: ""

# restic_restart_necessary controls whether the restic systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
restic_restart_necessary: false
