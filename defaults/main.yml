########################################################################
#                                                                      #
# healthchecks                                                         #
#                                                                      #
########################################################################

# Setting a Healthchecks ping URL will make restic ping your Healthchecks project when a backup begins, ends, or errors
# See: https://torsion.org/restic/reference/configuration/monitoring/healthchecks/
restic_healthchecks_ping_url: ""

# Specify possible states to ping
restic_healthchecks_states:
  - start
  - finish
  - fail

########################################################################
#                                                                      #
# /healthchecks                                                        #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# ntfy                                                                 #
#                                                                      #
########################################################################

# Setting ntfy's topic and the address of your self-hosted ntfy instance will have restic send push notifications when a backup task fails
# See: https://torsion.org/restic/reference/configuration/monitoring/ntfy/
restic_ntfy_topic: ""
restic_ntfy_server: ""

restic_ntfy_access_username: ""
restic_ntfy_access_password: ""

restic_ntfy_access_token: ""

########################################################################
#                                                                      #
# /ntfy                                                                #
#                                                                      #
########################################################################

# Default restic configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `restic_configuration_extension_yaml`)
# or completely replace this variable with your own template.
restic_configuration_yaml: "{{ lookup('template', 'templates/config.yaml.j2') }}"

restic_configuration_extension_yaml: |
  # Your custom YAML configuration for restic goes here.
  # This configuration extends the default starting configuration (`restic_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `restic_configuration_yaml`.

restic_configuration_extension: "{{ restic_configuration_extension_yaml | from_yaml if restic_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final restic configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `restic_configuration_yaml`.
restic_configuration: "{{ restic_configuration_yaml | from_yaml | combine(restic_configuration_extension, recursive=True) }}"

# restic_restart_necessary controls whether the restic systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
restic_restart_necessary: false
